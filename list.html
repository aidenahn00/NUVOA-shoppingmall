<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUVOA 쇼핑몰 - 취업용 포트폴리오</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css">
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/list.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/footer.css">
    <script src="./js/header.js" defer></script>
    <script src="./js/list.js" defer></script>    

    <!-- 제품 정보 -->
    <script src="./js/new-product.js" defer></script>
    <script src="./js/product-control-new.js" defer></script>
    
    <!-- 공통 header / footer 파일 연결 -->
    <script src="./js/include.js" defer></script>

    <!-- 검색 엔진 아래 텍스트 -->
    <meta name="description" content="NUVOA는 일상의 공간에 자연스럽게 스며드는 감각적인 가구를 제안합니다. 거실, 다이닝, 침실, 스토리지를 위한 미니멀하고 세련된 가구를 만나보세요.">
    <!-- 검색하는 키워드들을 가져옴 -->
    <meta name="keywords" content="NUVOA쇼핑몰, NUVOA가구, 가구쇼핑몰, 가구, 인테리어가구, 소파, 침대, 테이블, 식탁, 의자">
    <!-- 저자 -->
    <meta name="author" content="NUVOA 쇼핑몰">
    <!-- 검색엔진이 기본적으로 색인하나, 색인 명시적으로 더 허용 -->
    <meta name="robots" content="index, follow">
    <!-- 대표 URL -->
    <link rel="canonical" href="https://nuvoa.example.com/">
    <!-- Open Graph : 카카오톡 / 페이스북 / 디스코드 등 -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="NUVOA">
    <meta property="og:title" content="NUVOA | 감각적인 프리미엄 가구 쇼핑몰">
    <meta property="og:description" content="일상에 자연스럽게 스며드는 가구. NUVOA와 함께 당신의 공간을 완성해보세요.">
    <meta property="og:url" content="https://aidenahn00.github.io.com/NUVOA-shoppingmall">
    <meta property="og:image" content="https://aidenahn00.github.io.com/NUVOA-shoppingmall/img/og/nuvoa-og.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="NUVOA 프리미엄 가구 컬렉션">
    <meta property="og:locale" content="ko_KR">
    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="NUVOA | 감각적인 프리미엄 가구 쇼핑몰">
    <meta name="twitter:description" content="거실부터 침실까지, 공간에 자연스럽게 스며드는 NUVOA의 가구를 만나보세요.">
    <meta name="twitter:image" content="https://aidenahn00.github.io.com/NUVOA-shoppingmall/img/og/nuvoa-og.jpg">
    <meta name="twitter:image:alt" content="NUVOA 프리미엄 가구 컬렉션">
    <!-- 파비콘 -->
    <link rel="icon" type="image/png" href="./img/favicon.png">
</head>

<body>
    <div id="header-wrap">
        <!-- header.html 파일의 내용이 들어오는 영역 -->
    </div>

    <!-- 메인 -->
    <main>
        <div class="hero-banner">
            <a href="#">
                <picture>
                    <source media="(max-width: 768px)" srcset="./img/list-hero-mo.jpg">
                    <source media="(max-width: 1200px)" srcset="./img/list-hero-pad.jpg">
                    <img src="./img/list-hero-pc.jpg" alt="NUVOA 쇼핑몰 신상품 배너 이미지">
                </picture>
            </a>
        </div>
        <section class="con1">
            <div class="common-frame">
                <div class="title">
                    <h1>A New Beginning</h1>
                    <p>새로운 공간의 시작, NUVOA의 신상품</p>
                </div>
                <ul class="new-product grid-list">
                    <li>
                        <a href="#">
                            <figure>
                                <img src="./img/new1.jpg" alt="OVE LINEN SOFA">
                            </figure>
                            <div class="sale-txt">
                                <h4 class="title-1">OVE LINEN SOFA</h4>
                                <p class="desc-1">부드러운 린넨 패브릭과 낮고 넓은 실루엣으로 편안한 휴식을 완성하는 3인용 소파</p>
                                <div class="pay-frame">
                                    <div class="pay-original"><span>300,000</span>원</div>
                                    <div class="pay-discount">
                                        <div class="discount">20%</div>
                                        <div class="pay"><b>300,000</b>원</div>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </li>
                </ul>
            </div>
        </section>
    </main>

    <!-- 푸터 -->
     <div id="footer-wrap">
        <!-- footer.html 파일의 내용이 들어오는 영역 -->
     </div>
     
</body>

</html>
